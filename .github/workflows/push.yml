name: CI

on:
  push:
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21
    strategy:
      matrix:
        model:
          [
            # This fork only targets the Pinecil V2; upstream builds every model here
            "Pinecilv2",
          ]
      fail-fast: false

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache gcc-riscv-none-elf g++-riscv-none-elf gcc-arm-none-eabi g++-arm-none-eabi newlib-riscv-none-elf newlib-arm-none-eabi findutils python3 py3-pip make git bash

      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib pyyaml

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Git ownership exception
        run: git config --global --add safe.directory /__w/IronOS/IronOS && git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Git meta info
        run: echo "GITHUB_CI_PR_SHA=${{github.event.pull_request.head.sha}}" >> "${GITHUB_ENV}"

      - name: Build ${{ matrix.model }}
        run: cd source && ./build.sh -m ${{ matrix.model }}

      - name: Copy license files
        run: cp LICENSE scripts/LICENSE_RELEASE.md  source/Hexfile/

      - name: Generate json index file
        run: ./source/metadata.py ${{ matrix.model }}.json

      - name: Archive ${{ matrix.model }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.model }}
          path: |
            source/Hexfile/${{ matrix.model }}_*.hex
            source/Hexfile/${{ matrix.model }}_*.dfu
            source/Hexfile/${{ matrix.model }}_*.bin
            source/Hexfile/${{ matrix.model }}_*.elf
            source/Hexfile/${{ matrix.model }}.json
            source/Hexfile/LICENSE
            source/Hexfile/LICENSE_RELEASE.md
          if-no-files-found: error

  build_multi-lang:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21
    strategy:
      matrix:
        model: ["Pinecilv2"]
      fail-fast: false

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache gcc-riscv-none-elf g++-riscv-none-elf gcc-arm-none-eabi g++-arm-none-eabi newlib-riscv-none-elf newlib-arm-none-eabi findutils python3 py3-pip make git bash musl-dev
      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib pyyaml
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Git ownership exception
        run: git config --global --add safe.directory /__w/IronOS/IronOS && git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Git meta info
        run: echo "GITHUB_CI_PR_SHA=${{github.event.pull_request.head.sha}}" >> "${GITHUB_ENV}"

      - name: Build ${{ matrix.model }}
        run: make -C source/ -j$(nproc) model="${{ matrix.model }}" firmware-multi_compressed_European firmware-multi_compressed_Belarusian+Bulgarian+Russian+Serbian+Ukrainian firmware-multi_Chinese+Japanese

      - name: Copy license files
        run: cp LICENSE scripts/LICENSE_RELEASE.md  source/Hexfile/

      - name: Generate json index file
        run: ./source/metadata.py ${{ matrix.model }}_multi-lang.json

      - name: Archive ${{ matrix.model }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.model }}_multi-lang
          path: |
            source/Hexfile/${{ matrix.model }}_*.hex
            source/Hexfile/${{ matrix.model }}_*.dfu
            source/Hexfile/${{ matrix.model }}_*.bin
            source/Hexfile/${{ matrix.model }}_*.elf
            source/Hexfile/${{ matrix.model }}_multi-lang.json
            source/Hexfile/LICENSE
            source/Hexfile/LICENSE_RELEASE.md
          if-no-files-found: error

  upload_metadata:
    needs: [build, build_multi-lang]
    runs-on: ubuntu-24.04

    steps:
      - name: Download all prebuilts
        uses: actions/download-artifact@v8
        with:
          path: source/Hexfile/
          merge-multiple: true
      - run: ls -R source/Hexfile

      - name: Upload JSONs in bulk as metadata
        uses: actions/upload-artifact@v7
        with:
          name: metadata
          path: source/Hexfile/*.json
          if-no-files-found: error

  memory_usage_report:
    needs: [build, build_multi-lang]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: source/Hexfile/
          merge-multiple: true

      - name: Generate memory report from ELF files
        run: python3 scripts/ci/generate_memory_usage_report.py --elf-dir source/Hexfile --output memory-usage-comment.md

      - name: Publish report in the job summary
        run: cat memory-usage-comment.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment report on PR
        uses: actions/github-script@v9
        with:
          script: |
            // Pull requests from a fork get a read-only GITHUB_TOKEN whatever the permissions block
            // asks for, so commenting is not possible there. The report is in the job summary either
            // way; do not fail the run over it.
            try {
              const fs = require('fs');
              const marker = '<!-- ironos-memory-usage-report -->';
              const body = fs.readFileSync('memory-usage-comment.md', 'utf8');
              const fullBody = `${marker}\n${body}`;
              const issue_number = context.issue.number;

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  per_page: 100,
                }
              );

              const existing = comments.find(
                (comment) => comment.user && comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: fullBody,
                });
                core.info(`Updated existing memory usage comment: ${existing.id}`);
              } else {
                const created = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body: fullBody,
                });
                core.info(`Created memory usage comment: ${created.data.id}`);
              }
            } catch (error) {
              if (error.status === 403) {
                core.info('No write access to comment on this pull request (fork); see the job summary for the report.');
              } else {
                throw error;
              }
            }

  tests:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache python3 py3-pip make git bash findutils gcc musl-dev

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib pyyaml

      - name: Run python tests
        run: ./Translations/make_translation_test.py

      - name: Run BriefLZ tests
        run: make  -C source/  Objects/host/brieflz/libbrieflz.so && ./Translations/brieflz_test.py

  check_c-cpp:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache make git diffutils findutils clang-extra-tools bash

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check format style with clang-format
        run: make  clean  check-style

  check-settings-docs:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache python3 git

      - uses: actions/checkout@v7

      - name: Git ownership exception
        run: git config --global --add safe.directory /__w/IronOS/IronOS && git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Run the menu docs generator
        run: python3 "$GITHUB_WORKSPACE/Translations/gen_menu_docs.py"

      - name: Check that Documentation/Settings.md didn't change
        run: git -C "$GITHUB_WORKSPACE" diff --exit-code

  check_python:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache python3 py3-pip make git black

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib pyyaml flake8

      - name: Check python formatting with black
        run: black --diff --check Translations

      - name: Check python with flake8
        run: flake8 Translations

  check_shell:
    name: check_shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review # Change reporter.
          exclude: "./.git/*" # Optional.
          check_all_files_with_shebangs: "false" # Optional.

  check_docs:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache git bash grep

      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags: true
          fetch-depth: 0

      - name: Git ownership exception
        run: git config --global --add safe.directory /__w/IronOS/IronOS && git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Check and verify documentation
        run: ./scripts/deploy.sh docs

  # This fork: publish a numbered release for every successful push to dev.
  # Name = upstream BUILD_VERSION from source/version.h + "-SYN.<n>", e.g. v2.24-SYN.1, v2.24-SYN.2, ...
  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    needs: [build, build_multi-lang, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download the Pinecil V2 builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Work out the release name and notes
        id: version
        run: |
          base=$(sed -n 's/^#define BUILD_VERSION "\(.*\)"$/\1/p' source/version.h)
          if [ -z "$base" ]; then
            echo "Could not read BUILD_VERSION from source/version.h"
            exit 1
          fi

          # Next free number for this upstream version
          git fetch --tags --force origin
          last=0
          for t in $(git tag --list "${base}-SYN.*"); do
            n="${t#"${base}-SYN."}"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$last" ]; then last="$n"; fi
          done
          tag="${base}-SYN.$((last + 1))"
          prev=$(git describe --tags --abbrev=0 --match '*-SYN.*' "$GITHUB_SHA" 2>/dev/null || true)
          echo "Release: $tag (previous: ${prev:-none})"

          {
            echo "## IronOS ${base} for the Pinecil V2, with this fork's customisations"
            echo
            echo "Built from \`dev\` at ${GITHUB_SHA:0:8}. Based on upstream [Ralim/IronOS](https://github.com/Ralim/IronOS) ${base} (development branch)."
            echo "What's different from stock IronOS: [Pinecil V2 customisations](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md#pinecil-v2-customisations)."
            echo
            echo "### Install"
            echo
            echo "Flash \`Pinecilv2_EN.bin\` (or another language) to a Pinecil V2 the usual way. It goes at flash address \`0x2000\`, for example with blisp or PineFlash using a local file. Your settings are kept."
            echo "The \`Pinecilv2_multi_*.bin\` files contain several languages you can switch between on the iron."
            echo
            echo "### Use this fork as a firmware source in PineFlash"
            echo
            echo "This release includes \`Pinecilv2.zip\` and \`metadata.zip\` in the same layout as official IronOS releases, so PineFlash can list it next to official IronOS:"
            echo
            echo "1. Select **Pinecil V2**, open the firmware version list, and choose **Manage sources...**"
            echo "2. Add \`${GITHUB_REPOSITORY}\` and close the window."
            echo "3. Pick **${GITHUB_REPOSITORY} · ${tag}** (or a newer \`-SYN\` release) from the firmware list, choose your language, and flash."
            echo
            echo "New \`-SYN\` releases show up there automatically. Only the newest 5 are listed."
            echo
            if [ -n "$prev" ]; then
              echo "### Changes since ${prev}"
              echo
              git log --no-merges --format='- %s (%h)' "${prev}..${GITHUB_SHA}"
            else
              echo "First release of this fork."
            fi
          } > release-notes.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # IronOS-style assets so tools like PineFlash can use this repo as a firmware source:
          #   Pinecilv2.zip - the single-language Pinecilv2_<LANG>.bin files at the zip root
          #   metadata.zip  - Pinecilv2.json (language list) at the zip root
          single=artifacts/Pinecilv2
          if [ ! -f "$single/Pinecilv2.json" ] || ! ls "$single"/Pinecilv2_*.bin > /dev/null 2>&1; then
            echo "Missing Pinecilv2.json or Pinecilv2_*.bin in $single"
            ls -la artifacts artifacts/* || true
            exit 1
          fi
          (cd "$single" && zip -q -X "$GITHUB_WORKSPACE/Pinecilv2.zip" Pinecilv2_*.bin)
          (cd "$single" && zip -q -X "$GITHUB_WORKSPACE/metadata.zip" Pinecilv2.json)

          mapfile -t files < <(find artifacts -type f -name 'Pinecilv2_*.bin' | sort)
          files=(Pinecilv2.zip metadata.zip "${files[@]}")
          printf 'Attaching %s\n' "${files[@]}"
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --latest \
            "${files[@]}"
